version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=whatsapp_api
      - DB_USER=whatsapp
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379
      - ADMIN_KEY=${ADMIN_KEY}
      - WEBHOOK_TIMEOUT=${WEBHOOK_TIMEOUT:-10000}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - MEDIA_URL_WHITELIST=${MEDIA_URL_WHITELIST:-}
      - WEBHOOK_LOG_RETENTION_DAYS=${WEBHOOK_LOG_RETENTION_DAYS:-30}
      - WEBHOOK_RETRY_ATTEMPTS=${WEBHOOK_RETRY_ATTEMPTS:-3}
      - WEBHOOK_RETRY_DELAY=${WEBHOOK_RETRY_DELAY:-1000}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - BAILEYS_LOG_LEVEL=${BAILEYS_LOG_LEVEL:-silent}
      - MAX_RECONNECTION_ATTEMPTS=${MAX_RECONNECTION_ATTEMPTS:-3}
      - API_DOMAIN=${API_DOMAIN:-api-wa.replypro.cm}
    volumes:
      - ../../sessions:/app/sessions
      - ../../logs:/app/logs
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - whatsapp-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=whatsapp_api
      - POSTGRES_USER=whatsapp
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  whatsapp-network:
    driver: bridge

