# Configuration Nginx pour accès direct via IP
# Accessible sur: http://81.17.96.129:81

server {
    listen 81;
    listen [::]:81;
    server_name 81.17.96.129 _;

    # Logs
    access_log /var/log/nginx/api-ip-access.log;
    error_log /var/log/nginx/api-ip-error.log;

    # Taille max upload (100MB pour les médias)
    client_max_body_size 100M;
    client_body_timeout 300s;
    client_body_buffer_size 128k;

    # Timeouts pour les webhooks
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # Security headers (même sans SSL, on met les headers de base)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy vers l'API Docker
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Headers pour WebSocket (si nécessaire)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Headers standards
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
        
        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check (sans logs)
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
        proxy_set_header Host $host;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

